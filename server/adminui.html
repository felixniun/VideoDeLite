<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VideoDelite 管理后台</title>
<style>
  :root {
    --bg: #1c1c1e; --card: #2c2c2e; --card2: #323234; --inset: #3a3a3c;
    --text: #f5f5f7; --text2: #a1a1a6; --text3: #636366;
    --sep: rgba(255,255,255,.09);
    --accent: #0a84ff; --green: #30d158; --red: #ff453a; --orange: #ff9f0a;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable',
      'Segoe UI', 'Microsoft YaHei UI', sans-serif;
    background: var(--bg); color: var(--text); padding: 24px 28px;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -.3px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .topbar .sub { color: var(--text2); font-size: 13px; margin-top: 4px; }
  .topbar-actions { display: flex; gap: 10px; }
  .btn {
    font: inherit; border: none; border-radius: 980px; padding: 8px 18px;
    font-weight: 600; cursor: pointer; background: var(--inset); color: var(--text);
    transition: all .18s ease; font-size: 13.5px;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.small { padding: 4px 12px; font-size: 12.5px; }
  .btn.danger { background: rgba(255,69,58,.16); color: var(--red); }
  .card {
    background: var(--card); border-radius: 18px;
    box-shadow: 0 1px 3px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    padding: 20px 22px; margin-bottom: 16px;
  }
  .card h2 {
    font-size: 12.5px; color: var(--text2); text-transform: uppercase;
    letter-spacing: .5px; font-weight: 650; margin-bottom: 14px;
  }
  /* stat cards */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat {
    background: var(--card); border-radius: 18px; padding: 18px 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
  .stat .num { font-size: 30px; font-weight: 700; letter-spacing: -.5px; }
  .stat .lbl { font-size: 12.5px; color: var(--text2); margin-top: 4px; }
  .stat.accent .num { color: var(--accent); }
  .stat.green .num { color: var(--green); }
  .stat.orange .num { color: var(--orange); }
  .stat.red .num { color: var(--red); }
  /* charts row */
  .charts { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; }
  @media (max-width: 860px) { .charts { grid-template-columns: 1fr; } }
  .chart-wrap svg { width: 100%; height: 220px; display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; color: var(--text2); font-size: 11.5px; text-transform: uppercase;
       letter-spacing: .5px; padding: 8px 10px; border-bottom: 1px solid var(--sep); }
  td { padding: 10px 10px; border-bottom: 1px solid var(--sep); }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 980px;
           font-size: 11.5px; font-weight: 600; background: var(--inset); color: var(--text2); }
  .badge.ok { background: rgba(48,209,88,.16); color: var(--green); }
  .badge.bad { background: rgba(255,69,58,.15); color: var(--red); }
  .actions { display: flex; gap: 6px; }
  .muted { color: var(--text2); font-size: 12.5px; }
  #login { max-width: 400px; margin: 12vh auto; text-align: center; }
  #login input { width: 100%; margin: 12px 0; }
  #login button { width: 100%; margin-top: 6px; }
  input { background: var(--inset); border: 1.5px solid transparent; border-radius: 12px;
          padding: 10px 14px; font: inherit; outline: none; color: var(--text); }
  input:focus { border-color: var(--accent); }
  .kind-chart { display: flex; flex-direction: column; gap: 10px; }
  .kind-row { display: grid; grid-template-columns: 130px 1fr 44px; align-items: center; gap: 10px; font-size: 12.5px; }
  .kind-bar { height: 8px; border-radius: 4px; background: var(--accent); min-width: 2px; }
  .kind-track { background: var(--inset); border-radius: 4px; height: 8px; overflow: hidden; }
  .kind-count { text-align: right; color: var(--text2); font-weight: 600; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="login" class="card">
  <h1 style="text-align:center">VideoDelite 管理后台</h1>
  <p class="muted" style="text-align:center;margin-bottom:14px">输入管理密钥（服务器 config 的 adminKey）</p>
  <input id="key" type="password" placeholder="Admin Key">
  <button class="btn primary" onclick="login()">进入控制台</button>
  <p id="loginErr" class="muted" style="color:var(--red);margin-top:12px;text-align:center"></p>
</div>

<div id="app" style="display:none">
  <div class="topbar">
    <div>
      <h1>VideoDelite 管理后台</h1>
      <div class="sub">数据每 60 秒自动刷新 · <span id="updatedAt">—</span></div>
    </div>
    <div class="topbar-actions">
      <button class="btn" onclick="loadAll()">刷新</button>
      <button class="btn" onclick="logout()">退出</button>
    </div>
  </div>

  <div class="stats" id="statCards"></div>

  <div class="charts">
    <div class="card">
      <h2>近 14 天注册趋势</h2>
      <div class="chart-wrap" id="regChart"></div>
    </div>
    <div class="card">
      <h2>安全事件分布（近 200 条）</h2>
      <div class="kind-chart" id="kindChart"></div>
    </div>
  </div>

  <div class="card">
    <h2>账号</h2>
    <table id="accounts"><thead><tr>
      <th>ID</th><th>用户名</th><th>邮箱</th><th>状态</th><th>邮箱验证</th><th>注册时间</th><th style="text-align:right">操作</th>
    </tr></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <h2>安全事件</h2>
    <table id="events"><thead><tr>
      <th>ID</th><th>账号</th><th>类型</th><th>详情</th><th>时间</th>
    </tr></thead><tbody></tbody></table>
  </div>

  <p class="muted" style="text-align:center;margin:16px 0">
    VideoDelite v1 授权体系完全免费 · 授权自动签发 · 商业化权益流程已预留接口
  </p>
</div>

<script>
const KEY = 'vd_admin_key';
const headers = () => ({ 'X-Admin-Key': localStorage.getItem(KEY) || '', 'Content-Type': 'application/json' });

async function api(path, opts) {
  const r = await fetch(path, { headers: headers(), ...opts });
  if (r.status === 403) { if (document.getElementById('app').style.display !== 'none') logout(true); throw new Error('forbidden'); }
  return r.json();
}

const KIND_ZH = {
  register: '注册', login: '登录', login_failed: '登录失败', login_banned: '封禁期登录',
  email_verified: '邮箱验证', resend_verification: '重发验证码',
  device_activated: '设备激活', activation_banned: '封禁期激活',
  license_revoked_by_admin: '管理员撤销授权', account_banned: '账号封禁', account_deleted: '账号删除'
};

function login() {
  localStorage.setItem(KEY, document.getElementById('key').value.trim());
  loadAll().then(() => {
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }).catch(() => {
    document.getElementById('loginErr').textContent = '密钥无效或服务端未启用管理接口';
  });
}

function logout(clearOnly) {
  localStorage.removeItem(KEY);
  location.reload();
}

/* ---------- SVG bar chart (self-contained, no libs) ---------- */
function barChart(el, data) {
  const W = 800, H = 200, pad = { l: 8, r: 8, t: 16, b: 24 };
  const max = Math.max(1, ...data.map(d => d.count));
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const bw = iw / data.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  // gridlines
  for (let i = 1; i <= 3; i++) {
    const y = pad.t + ih - (ih * i / 3);
    s += `<line x1="${pad.l}" y1="${y}" x2="${W - pad.r}" y2="${y}" stroke="rgba(255,255,255,.06)"/>`;
    s += `<text x="${W - pad.r}" y="${y - 3}" fill="#636366" font-size="10" text-anchor="end">${Math.round(max * i / 3)}</text>`;
  }
  data.forEach((d, i) => {
    const h = Math.max(d.count > 0 ? 3 : 0, ih * d.count / max);
    const x = pad.l + i * bw + bw * 0.18;
    const w = bw * 0.64;
    const y = pad.t + ih - h;
    s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="#0a84ff" opacity="${d.count > 0 ? 0.95 : 0.25}"><title>${d.day}: ${d.count}</title></rect>`;
    if (data.length <= 14 && i % Math.ceil(data.length / 7) === 0 || i === data.length - 1) {
      s += `<text x="${x + w / 2}" y="${H - 6}" fill="#636366" font-size="10" text-anchor="middle">${d.day}</text>`;
    }
  });
  s += '</svg>';
  el.innerHTML = s;
}

function kindChart(el, events) {
  const counts = {};
  for (const e of events) counts[e.Kind] = (counts[e.Kind] || 0) + 1;
  const rows = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const max = Math.max(1, ...rows.map(r => r[1]));
  el.innerHTML = rows.map(([k, v]) => `
    <div class="kind-row">
      <span>${KIND_ZH[k] || k}</span>
      <div class="kind-track"><div class="kind-bar" style="width:${v / max * 100}%"></div></div>
      <span class="kind-count">${v}</span>
    </div>`).join('') || '<span class="muted">暂无事件</span>';
}

function statCards(st) {
  const cards = [
    { n: st.totalAccounts, l: '总用户', c: 'accent' },
    { n: st.verifiedAccounts, l: '已验证邮箱', c: 'green' },
    { n: st.totalDevices, l: '已激活设备', c: '' },
    { n: st.activeLicenses, l: '有效授权', c: 'green' },
    { n: st.bannedAccounts, l: '封禁账号', c: 'red' },
    { n: st.eventsToday, l: '今日安全事件', c: 'orange' }
  ];
  document.getElementById('statCards').innerHTML = cards.map(c =>
    `<div class="stat ${c.c}"><div class="num">${c.n}</div><div class="lbl">${c.l}</div></div>`).join('');
}

async function loadAll() {
  const st = await api('/api/v1/admin/stats');
  const acc = await api('/api/v1/admin/accounts');
  const ev = await api('/api/v1/admin/security-events');

  statCards(st);
  barChart(document.getElementById('regChart'), st.registrations || []);
  kindChart(document.getElementById('kindChart'), ev.events || []);

  const tb = document.querySelector('#accounts tbody');
  tb.innerHTML = '';
  for (const a of (acc.accounts || [])) {
    const tr = document.createElement('tr');
    const status = a.Status === 'active'
      ? '<span class="badge ok">active</span>'
      : '<span class="badge bad">' + a.Status + '</span>';
    const verified = a.EmailVerified ? '<span class="badge ok">已验证</span>' : '<span class="badge">未验证</span>';
    tr.innerHTML = `<td>${a.ID}</td><td>${esc(a.Username)}</td><td>${esc(a.Email)}</td><td>${status}</td><td>${verified}</td><td>${new Date(a.CreatedAt).toLocaleString()}</td>
      <td><div class="actions" style="justify-content:flex-end">
        <button class="btn small" onclick="ban(${a.ID}, ${a.Status === 'active'})">${a.Status === 'active' ? '封禁' : '解封'}</button>
        <button class="btn small danger" onclick="revoke(${a.ID})">撤销授权</button>
      </div></td>`;
    tb.appendChild(tr);
  }

  const et = document.querySelector('#events tbody');
  et.innerHTML = '';
  for (const e of (ev.events || []).slice(0, 100)) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${e.ID}</td><td>${e.AccountID}</td><td>${esc(e.Kind)}</td><td>${esc(e.Detail)}</td><td>${new Date(e.CreatedAt).toLocaleString()}</td>`;
    et.appendChild(tr);
  }
  document.getElementById('updatedAt').textContent = new Date().toLocaleTimeString();
}

async function ban(id, currentlyActive) {
  await api(`/api/v1/admin/accounts/${id}/` + (currentlyActive ? 'ban' : 'unban'), { method: 'POST' });
  loadAll();
}
async function revoke(id) {
  if (!confirm('撤销该账号的全部 Professional 授权？（客户端新任务将被锁定，正在运行的任务不受影响）')) return;
  await api(`/api/v1/admin/accounts/${id}/revoke-licenses`, { method: 'POST' });
  loadAll();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

setInterval(() => {
  if (document.getElementById('app').style.display !== 'none') loadAll().catch(() => {});
}, 60000);
</script>
</body>
</html>
